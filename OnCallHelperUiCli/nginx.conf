server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: serve index.html for client-side routes
    # so refreshing /search, /log, etc. does not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively (they are content-hashed).
    location /js/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /css/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
